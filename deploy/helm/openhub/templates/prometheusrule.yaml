{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "openhub.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "openhub.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: openhub.rules
      rules:
        - alert: OpenHUBHighErrorRate
          expr: |
            (
              rate(openhub_requests_total{status=~"5.."}[5m])
              / rate(openhub_requests_total[5m])
            ) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "openhub high error rate"
            description: "5xx error rate is above 5% for 5 minutes"
        - alert: OpenHUBHighLatency
          expr: |
            histogram_quantile(0.99,
              rate(openhub_request_duration_seconds_bucket[5m])
            ) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "openhub high p99 latency"
            description: "p99 request latency is above 10 seconds"
        - alert: OpenHUBPodDown
          expr: |
            kube_statefulset_status_replicas_ready{statefulset="{{ include "openhub.workloadName" . }}"}
            < kube_statefulset_replicas{statefulset="{{ include "openhub.workloadName" . }}"}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "openhub pods unavailable"
            description: "Available replicas is less than desired"
        - alert: OpenHUBHPAAtMax
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler="{{ include "openhub.fullname" . }}"}
            >= kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler="{{ include "openhub.fullname" . }}"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "openhub HPA at maximum replicas"
            description: "HPA has been at maximum replicas for 15 minutes"
        {{- with .Values.metrics.prometheusRule.additionalRules }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
