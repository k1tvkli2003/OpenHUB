[project]
name = "openhub"
version = "2.0.0"
description = "Provider-neutral local control plane for Codex, Hermes, OpenCode, and OpenAI account routing"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Keyvan" }]
maintainers = [{ name = "Keyvan" }]
keywords = [
    "codex",
    "hermes-agent",
    "opencode",
    "openai",
    "load-balancer",
    "proxy",
    "fastapi",
    "chatgpt",
    "rate-limit",
    "usage",
    "dashboard",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "aiohttp-retry>=2.9.1",
    "alembic>=1.19.1",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.30.0",
    "bcrypt>=4.3.0",
    "brotli>=1.2.0",
    "certifi>=2026.7.22",
    "cryptography>=46.0.6",
    "fastapi[standard]>=0.128.0",
    "greenlet>=3.5.5",
    "mako>=1.4.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    "pygments>=2.21.0",
    "python-socks[asyncio]>=2.7.2",
    "pyotp>=2.9.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.27",
    "pyyaml>=6.0.3",
    "psycopg[binary]>=3.2.12",
    "segno>=1.6.6",
    "sqlalchemy>=2.0.52",
    "urllib3>=2.7.0",
    "websockets>=16.0",
    "zstandard>=0.25.0",
    "aiohttp-socks>=0.12.0",
]

[project.optional-dependencies]
metrics = ["prometheus-client>=0.26.0"]
tracing = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46",
    "opentelemetry-instrumentation-aiohttp-client>=0.46",
    "opentelemetry-instrumentation-sqlalchemy>=0.46",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "httpx>=0.28.1",
    "ruff>=0.16.5",
    "ty==0.0.75",
    "openai>=2.16.0",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=7.1.0",
]
docs = [
    "mkdocs-material>=9.6",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "e2e: end-to-end flow tests",
    "integration: tests that exercise multiple layers together",
    "unit: fast isolated tests",
]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:sqlalchemy",
    "ignore::DeprecationWarning:aiosqlite",
    "ignore::ResourceWarning",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ty.src]
exclude = [".agents/hooks/"]

[tool.ty.environment]
python-version = "3.13"

[project.scripts]
openhub = "app.cli:main"
openhub-db = "app.db.migrate:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["app/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["app","config"]
