name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: openhub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Python backend
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --dev --frozen

      - name: Lint Python
        run: uv run ruff check app tests scripts

      - name: Run backend unit tests
        run: uv run pytest tests/unit -q

  dashboard:
    name: Web dashboard
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Lint and type-check
        run: |
          bun run lint
          bun run typecheck

      - name: Test and build
        run: |
          bun run test
          bun run build

  native-windows:
    name: Native Windows client
    runs-on: windows-2025
    defaults:
      run:
        working-directory: native_windows
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Enable Windows and resolve packages
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Analyze and test
        shell: pwsh
        run: |
          flutter analyze
          flutter test

      - name: Build release client
        run: flutter build windows --release --no-pub

  helm-contracts:
    name: Helm lint and Kubernetes schema
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4

      - name: Cache kubeconform
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/ci-tools/kubeconform
          key: kubeconform-0.7.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install checksum-verified kubeconform
        shell: bash
        run: |
          set -euo pipefail
          tool_dir=".cache/ci-tools/kubeconform"
          tool_path="${tool_dir}/kubeconform"
          if [[ ! -x "${tool_path}" ]]; then
            mkdir -p "${tool_dir}"
            asset="kubeconform-linux-amd64.tar.gz"
            base_url="https://github.com/yannh/kubeconform/releases/download/v0.7.0"
            curl -fsSLo "${tool_dir}/CHECKSUMS" "${base_url}/CHECKSUMS"
            curl -fsSLo "${tool_dir}/${asset}" "${base_url}/${asset}"
            (cd "${tool_dir}" && grep "  ${asset}$" CHECKSUMS | sha256sum -c -)
            tar xzf "${tool_dir}/${asset}" -C "${tool_dir}" kubeconform
          fi
          sudo install -m 0755 "${tool_path}" /usr/local/bin/kubeconform

      - name: Validate chart
        run: make helm-check

  helm-smoke:
    name: Helm smoke install
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4

      - name: Cache kind
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/ci-tools/kind
          key: kind-0.30.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install checksum-verified kind
        shell: bash
        run: |
          set -euo pipefail
          tool_dir=".cache/ci-tools/kind"
          tool_path="${tool_dir}/kind"
          if [[ ! -x "${tool_path}" ]]; then
            mkdir -p "${tool_dir}"
            base_url="https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0"
            curl -fsSLo "${tool_dir}/kind-linux-amd64" "${base_url}/kind-linux-amd64"
            curl -fsSLo "${tool_dir}/kind-linux-amd64.sha256sum" "${base_url}/kind-linux-amd64.sha256sum"
            (cd "${tool_dir}" && sha256sum -c kind-linux-amd64.sha256sum)
            mv "${tool_dir}/kind-linux-amd64" "${tool_path}"
            chmod +x "${tool_path}"
          fi
          sudo install -m 0755 "${tool_path}" /usr/local/bin/kind

      - name: Build and smoke-test chart
        run: make helm-smoke-kind

  contracts:
    name: OpenSpec contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Validate shipped specs and the OpenHUB release change
        run: |
          npm exec --yes --package=@fission-ai/openspec@1.10.0 -- openspec validate --specs --strict
          npm exec --yes --package=@fission-ai/openspec@1.10.0 -- openspec validate evolve-openhub-multi-runtime-control --type change --strict
